version: "3.8"

services:
  taskoo-web:
    build: ./infrastructure/docker/
    container_name: taskoo.web
    tty: true
    ports:
      - 3000:3000
      - 4000:4000
      - 4400:4400
      - 4500:4500
      - 5000:5000
      - 5001:5001
      - 6006:6006
      - 8080:8080
      - 8085:8085
      - 9099:9099
      - 9199:9199
      - 9229:9229
    command: >
      bash -c "./scripts/run_dev.sh"
    volumes:
      - .:/opt/app/src
